name: CI

on:
  # pushes only on the release branches (b-6.1.x, b-7.0.x, ...), everything else is tested via its pull request
  push:
    branches: ['b-*.x']
  pull_request:

jobs:
  run-b7-matrix:
    if: startsWith(github.base_ref || github.ref_name, 'b-7.')
    runs-on: ${{ matrix.operating-system }}
    strategy:
      max-parallel: 15
      fail-fast: false
      matrix:
        operating-system: [ubuntu-latest]
        oxid-versions: ['dev-b-7.1-ce', 'dev-b-7.2-ce', 'dev-b-7.3-ce', 'dev-b-7.4-ce', 'dev-b-7.5-ce']
        php-versions: ['8.1', '8.2', '8.3', '8.4', '8.5']
        exclude:
          - oxid-versions: 'dev-b-7.1-ce'
            php-versions: '8.4'
          - oxid-versions: 'dev-b-7.1-ce'
            php-versions: '8.5'
          - oxid-versions: 'dev-b-7.2-ce'
            php-versions: '8.1'
          - oxid-versions: 'dev-b-7.2-ce'
            php-versions: '8.4'
          - oxid-versions: 'dev-b-7.2-ce'
            php-versions: '8.5'
          - oxid-versions: 'dev-b-7.3-ce'
            php-versions: '8.1'
          - oxid-versions: 'dev-b-7.3-ce'
            php-versions: '8.5'
          - oxid-versions: 'dev-b-7.4-ce'
            php-versions: '8.1'
          - oxid-versions: 'dev-b-7.4-ce'
            php-versions: '8.5'
          - oxid-versions: 'dev-b-7.5-ce'
            php-versions: '8.1'
          - oxid-versions: 'dev-b-7.5-ce'
            php-versions: '8.2'
    
    name: Oxid ${{ matrix.oxid-versions }} on PHP ${{ matrix.php-versions }}
    steps:
      - name: Clone testing environment
        run: git clone https://github.com/OXID-eSales/docker-eshop-sdk.git .

      - name: Clone the shop
        run: |
          composer create-project -n --no-progress --no-install oxid-esales/oxideshop-project ./source ${{ matrix.oxid-versions }}
          cd source
          composer config audit.block-insecure false
          # for oxid 6.3
          # composer config --no-plugins allow-plugins.oxid-esales/oxideshop-unified-namespace-generator true
          # composer config --no-plugins allow-plugins.oxid-esales/oxideshop-composer-plugin true

      - name: Prepare container configuration
        run: |
          make setup
          make addbasicservices
          make file=services/selenium-chrome.yml addservice
          perl -pi -e "s#PHP_VERSION=.*#PHP_VERSION=${{ matrix.php-versions }}#g;" .env
          perl -pi -e "s#MYSQL_VERSION=.*#MYSQL_VERSION=5.7#g;" .env
          perl -pi -e 's#/var/www/#/var/www/source/#g;' containers/httpd/project.conf

      - name: Start containers
        run: |
          make up
          sleep 2

      - name: Install Shop dependencies
        run: |
          docker compose exec -T php composer update --no-interaction --no-scripts

      - name: Prepare shop configuration
        run: |
          cp source/source/config.inc.php.dist source/source/config.inc.php

      - name: Setup Shop and demodata Oxid 7
        run: |
          docker compose exec -T php /var/www/vendor/bin/oe-console oe:setup:shop \
            --db-host mysql \
            --db-port 3306 \
            --db-name example \
            --db-user root \
            --db-password root \
            --shop-url http://localhost.local \
            --shop-directory /var/www/source \
            --compile-directory /var/www/source/tmp \
            --language=de
          docker compose exec -T php /var/www/vendor/bin/oe-console oe:setup:demodata
          
      - name: set composer.json to dev stability
        run: |
          docker compose exec -T \
          php sed -i 's/"minimum-stability": "stable",/"minimum-stability": "dev",/' /var/www/composer.json          

      - name: Checkout current module
        uses: actions/checkout@v5
        with:
          path: source/source/extensions/easycredit

      - name: Add module with composer
        run: |
          docker compose exec -T php \
            composer config repositories.oxid-professional-services/easycredit-module \
            --json '{"type":"path", "url":"/var/www/source/extensions/easycredit", "options": {"symlink": true}}'
          docker compose exec -T php \
            composer require oxid-professional-services/easycredit-module:* --no-interaction --no-update
          docker compose exec -T php \
            composer update --no-interaction

      - name: Install Easycredit Module Oxid 7
        run: |
          docker compose exec -T php /var/www/vendor/bin/oe-console oe:module:install source/extensions/easycredit          

      - name: Install Apex Theme Oxid 7
        run: |
          docker compose exec -T php /var/www/vendor/bin/oe-console oe:theme:activate apex          

      - name: Activate Easycredit Module Oxid 7
        run: |
          docker compose exec -T php /var/www/vendor/bin/oe-console oe:module:activate osceasycredit

      - name: Clear Oxid Cache
        run: |
          \rm -R source/source/tmp/*

      - name: Install Testing Lib Oxid 7
        run: |
          docker compose exec -T \
            php composer require oxid-esales/testing-library:dev-b-8.0.x
          docker compose exec -T \
            php composer update
          # fix exceptions after install the testing library
          head -n -2 source/var/generated/generated_services.yaml > generated_services.yaml.tmp
          mv generated_services.yaml.tmp source/var/generated/generated_services.yaml

      - name: create test_config.yml
        run: |
          docker compose exec -T php mv /var/www/source/extensions/easycredit/.github/test_config_oxid7.yml /var/www/test_config.yml

      - name: Configure module for v3 API
        env:
          MODULE_SETTINGS_OXID7_V3: ${{ secrets.MODULE_SETTINGS_OXID7_V3 }}
        run: |
          mkdir -p source/var/configuration/shops/1/modules
          printf '%s\n' "$MODULE_SETTINGS_OXID7_V3" > source/var/configuration/shops/1/modules/osceasycredit.yaml
          
      - name: Run tests with testing lib against v3 API
        run: |
          docker compose exec -T php /var/www/vendor/bin/runtests   
          
      - name: Configure module for v2 API
        env:
          MODULE_SETTINGS_OXID7_V2: ${{ secrets.MODULE_SETTINGS_OXID7_V2 }}
        run: |
          mkdir -p source/var/configuration/shops/1/modules
          printf '%s\n' "$MODULE_SETTINGS_OXID7_V2" > source/var/configuration/shops/1/modules/osceasycredit.yaml

      - name: Run tests with testing lib against v2 API
        run: |
          docker compose exec -T php /var/www/vendor/bin/runtests          

  run-b6-matrix:
    if: startsWith(github.base_ref || github.ref_name, 'b-6.')
    runs-on: ${{ matrix.operating-system }}
    strategy:
      max-parallel: 15
      fail-fast: false
      matrix:
        operating-system: [ubuntu-latest]
        oxid-versions: ['dev-b-6.5-ce', 'dev-b-6.4-ce', 'dev-b-6.3-ce']
        php-versions: ['7.4', '8.0', '8.1']
        exclude:
          - oxid-versions: 'dev-b-6.4-ce'
            php-versions: '8.1'
          - oxid-versions: 'dev-b-6.3-ce'
            php-versions: '8.1'
    steps:
      - name: Clone testing environment
        run: git clone https://github.com/OXID-eSales/docker-eshop-sdk.git .

      - name: Clone the shop
        run: |
          composer create-project -n --no-progress --no-install oxid-esales/oxideshop-project ./source ${{ matrix.oxid-versions }}
          cd source
          composer config audit.block-insecure false
          # for oxid 6.3
          composer config --no-plugins allow-plugins.oxid-esales/oxideshop-unified-namespace-generator true
          composer config --no-plugins allow-plugins.oxid-esales/oxideshop-composer-plugin true

      - name: Prepare container configuration
        run: |
          make setup
          make addbasicservices
          make file=services/selenium-chrome.yml addservice
          perl -pi -e "s#PHP_VERSION=.*#PHP_VERSION=${{ matrix.php-versions }}#g;" .env
          perl -pi -e "s#MYSQL_VERSION=.*#MYSQL_VERSION=5.7#g;" .env
          perl -pi -e 's#/var/www/#/var/www/source/#g;' containers/httpd/project.conf
          perl -pi -e 's#display_errors =.*#display_errors = false#g;' -e 'print "xdebug.max_nesting_level=1000\nxdebug.mode=coverage\n\n"' containers/php/custom.ini

      - name: Start containers
        run: |
          make up
          sleep 2

      - name: Install Shop dependencies
        run: |
          docker compose exec -T php composer update --no-interaction --no-scripts

      - name: Prepare shop configuration
        run: |
          cp source/source/config.inc.php.dist source/source/config.inc.php
          sed -i "1s+^+SetEnvIf Authorization "\(.*\)" HTTP_AUTHORIZATION=\$1\n\n+" source/source/.htaccess
          sed -i -e 's/<dbHost>/mysql/'\
                 -e 's/<dbUser>/root/'\
                 -e 's/<dbName>/example/'\
                 -e 's/<dbPwd>/root/'\
                 -e 's/<dbPort>/3306/'\
                 -e 's/<sShopURL>/https:\/\/localhost.local\//'\
                 -e 's/<sShopDir>/\/var\/www\/source\//'\
                 -e 's/<sCompileDir>/\/var\/www\/source\/tmp\//'\
              source/source/config.inc.php

      - name: Install Shop demodata
        run: |
          cp source/source/Setup/Sql/database_schema.sql data/mysql/
          cp source/source/Setup/Sql/initial_data.sql data/mysql/
          cp source/vendor/oxid-esales/oxideshop-demodata-ce/src/demodata.sql data/mysql
          docker compose exec -T mysql mysql -uroot -proot example < data/mysql/database_schema.sql
          # docker compose exec -T mysql mysql -uroot -proot example < data/mysql/initial_data.sql
          docker compose exec -T mysql mysql -uroot -proot example < data/mysql/demodata.sql
          docker compose exec -T \
            php /var/www/vendor/bin/oe-eshop-db_views_regenerate

      - name: set composer.json to dev stability
        run: |
          docker compose exec -T \
          php sed -i 's/"minimum-stability": "stable",/"minimum-stability": "dev",/' /var/www/composer.json          

      - name: Checkout current module
        uses: actions/checkout@v5
        with:
          path: source/source/extensions/easycredit

      - name: Add module with composer
        run: |
          docker compose exec -T php \
            composer config repositories.oxid-professional-services/easycredit-module \
            --json '{"type":"path", "url":"/var/www/source/extensions/easycredit", "options": {"symlink": true}}'
          docker compose exec -T php \
            composer require oxid-professional-services/easycredit-module:* --no-interaction --no-update
          docker compose exec -T php \
            composer update --no-interaction

      - name: Install Easycredit module in oxid
        run: |
          docker compose exec -T php vendor/bin/oe-console oe:module:install source/modules/oxps/easycredit/

      - name: Activate Easycredit module
        run: |
          docker compose exec -T php /var/www/vendor/bin/oe-console oe:module:activate oxpseasycredit

      - name: Clear Oxid Cache
        run: |
          \rm -R source/source/tmp/*

      - name: configure module for v3 API
        env:
          MODULE_SETTINGS_OXID6_V3_PART1: ${{ secrets.MODULE_SETTINGS_OXID6_V3_PART1 }}
          MODULE_SETTINGS_OXID6_V3_PART2: ${{ secrets.MODULE_SETTINGS_OXID6_V3_PART2 }}
        run: |
          mkdir -p source/var/configuration/environment/
          printf '%s\n' "$MODULE_SETTINGS_OXID6_V3_PART1" > source/var/configuration/environment/1.yaml
          printf '%s\n' "$MODULE_SETTINGS_OXID6_V3_PART2" >> source/var/configuration/environment/1.yaml
          docker compose exec -T php php vendor/bin/oe-console oe:module:apply-configuration          

      - name: create test_config.yml
        run: |
          docker compose exec -T php mv /var/www/source/extensions/easycredit/.github/test_config_oxid6.yml /var/www/test_config.yml
          
      - name: Run tests with testing lib against v3 API
        run: |
          docker compose exec -T php /var/www/vendor/bin/runtests

      - name: configure module for v2 API
        env:
          MODULE_SETTINGS_OXID6_V2_PART1: ${{ secrets.MODULE_SETTINGS_OXID6_V2_PART1 }}
          MODULE_SETTINGS_OXID6_V2_PART2: ${{ secrets.MODULE_SETTINGS_OXID6_V2_PART2 }}
        run: |
          mkdir -p source/var/configuration/environment/
          printf '%s\n' "$MODULE_SETTINGS_OXID6_V2_PART1" > source/var/configuration/environment/1.yaml
          printf '%s\n' "$MODULE_SETTINGS_OXID6_V2_PART2" >> source/var/configuration/environment/1.yaml
          docker compose exec -T php php vendor/bin/oe-console oe:module:apply-configuration         

      - name: Run tests with testing lib against v2 API
        run: |
          docker compose exec -T php /var/www/vendor/bin/runtests     
  